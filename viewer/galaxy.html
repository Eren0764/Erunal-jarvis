<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Galaksisi</title>
<style>
  :root {
    --bg: #000;
    --ink: #e8ecf5;
    --muted: #8b93a8;
    --glass: rgba(14, 18, 30, 0.72);
    --edge: rgba(140, 170, 255, 0.16);
    --accent: #7cc4ff;
    --danger: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 14px;
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0,0,0,.55); }

  /* Header + legend */
  #hud { position: fixed; top: 16px; left: 16px; padding: 14px 16px; max-width: 260px; z-index: 5; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  #hud .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .legend { display: flex; flex-direction: column; gap: 4px; }
  .legend button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; padding: 2px 4px; border-radius: 6px; color: var(--ink); }
  .legend button:hover, .legend button.on { background: rgba(255,255,255,.07); }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .legend .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Side panel */
  #panel { position: fixed; top: 16px; right: 16px; bottom: 112px; width: 380px; padding: 20px 22px;
    z-index: 6; overflow-y: auto; transform: translateX(calc(100% + 32px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #panel.open { transform: none; }
  #panel .close { all: unset; cursor: pointer; position: absolute; top: 12px; right: 14px; font-size: 20px; color: var(--muted); padding: 4px 8px; }
  #panel .close:hover { color: var(--ink); }
  #panel .chip { display: inline-block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
  #panel h2 { margin: 12px 0 12px; font-size: 21px; line-height: 1.25; font-weight: 600; padding-right: 20px; }
  #panel .excerpt { white-space: pre-wrap; color: #cfd5e4; font-size: 13.5px; }
  #panel h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links button { all: unset; cursor: pointer; font-size: 12.5px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid var(--edge); }
  .links button:hover { background: rgba(255,255,255,.13); }

  /* Chat */
  #chat { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); z-index: 7; }
  #answer { display: none; padding: 16px 18px 14px; margin-bottom: 10px; max-height: 40vh; overflow-y: auto; }
  #answer.show { display: block; animation: rise .35s ease; }
  #answer.error .text { color: var(--danger); }
  #answer .q { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #answer .text { font-size: 15px; white-space: pre-wrap; }
  #answer .links { margin-top: 10px; }
  #answer .thinking::after { content: "…"; animation: blink 1s steps(3) infinite; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 16px; border-radius: 999px; }
  #bar input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; font-size: 15px; padding: 8px 0; }
  #bar input::placeholder { color: var(--muted); }
  #bar button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  #send { background: var(--accent); color: #04121f; }
  #send:disabled { opacity: .5; cursor: default; }
  #mic { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; color: var(--ink);
    background: rgba(255,255,255,.07); border: 1px solid var(--edge); box-sizing: border-box; }
  #mic:hover { background: rgba(255,255,255,.14); }
  #mic.on { background: #ff4d5e; color: #fff; border-color: transparent; animation: micPulse 1.4s ease-out infinite; }
  #mic:disabled { opacity: .35; cursor: not-allowed; }
  #status { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 16px; font-size: 12.5px; color: var(--muted);
    min-height: 18px; text-shadow: 0 1px 6px #000; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #5d6478; flex: none; }
  #status[data-mode="listening"] .dot { background: #ff4d5e; animation: blink 1.1s ease-in-out infinite; }
  #status[data-mode="thinking"] .dot { background: #ffd45e; animation: blink .7s ease-in-out infinite; }
  #status[data-mode="speaking"] .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink .45s ease-in-out infinite; }
  #status[data-mode="listening"] #statusText { color: #ff9aa4; }
  #status[data-mode="thinking"] #statusText { color: #ffe39a; }
  #status[data-mode="speaking"] #statusText { color: var(--accent); }
  #live { color: var(--ink); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,94,.6); } 100% { box-shadow: 0 0 0 12px rgba(255,77,94,0); } }
  #reset { color: var(--muted); }
  #reset:hover { color: var(--ink); }
  #hint { position: fixed; bottom: 118px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 12px; z-index: 4; pointer-events: none; transition: opacity .6s; }

  .scene-tooltip { font: 12.5px Inter, system-ui, sans-serif !important; background: rgba(10,14,24,.85) !important;
    padding: 4px 10px !important; border-radius: 8px !important; border: 1px solid var(--edge); }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0% { opacity: .2 } 50% { opacity: 1 } 100% { opacity: .2 } }

  @media (max-width: 760px) {
    #hud { max-width: calc(100% - 32px); padding: 10px 12px; }
    .legend { flex-direction: row; flex-wrap: wrap; }
    .legend .n { display: none; }
    #panel { top: auto; left: 16px; right: 16px; width: auto; bottom: 96px; max-height: 45vh; transform: translateY(calc(100% + 120px)); }
    #hint { display: none; }
    #bar { gap: 4px; padding-left: 12px; }
    #bar button { padding: 9px 10px; }
    #mic { padding: 0; }
  }
  #panel { bottom: 140px; }
  @media (min-width: 761px) { body:has(#answer.show) #panel { bottom: 330px; } }
  @media (max-width: 760px) { #panel { bottom: 130px; } }
</style>
</head>
<body>
<div id="graph"></div>

<div id="hud" class="glass">
  <h1>Bilgi Galaksisi</h1>
  <div class="sub" id="stats"></div>
  <div style="display:flex;gap:10px;align-items:center;margin:-4px 0 10px">
    <a href="/" style="font-size:12px;color:var(--accent);text-decoration:none">← Jarvis'e dön</a>
    <button type="button" id="memBtn" data-memory-button aria-expanded="false" title="Kayıtlı hafızayı göster"
      style="all:unset;cursor:pointer;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--edge);color:var(--ink)">Hafıza</button>
  </div>
  <div class="legend" id="legend"></div>
</div>

<aside id="panel" class="glass" aria-live="polite">
  <button class="close" id="closePanel" aria-label="Kapat" title="Kapat">×</button>
  <span class="chip" id="pGroup"></span>
  <h2 id="pTitle"></h2>
  <div class="excerpt" id="pExcerpt"></div>
  <h3>Bağlantılı notlar</h3>
  <div class="links" id="pLinks"></div>
</aside>

<div id="hint">Döndürmek için sürükleyin · yakınlaştırmak için kaydırın · not açmak için bir yıldıza tıklayın</div>

<div id="chat">
  <div id="answer" class="glass">
    <div class="q" id="aQ"></div>
    <div class="text" id="aText"></div>
    <div class="links" id="aLinks"></div>
  </div>
  <div id="status" data-mode="idle" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">Hazır</span><span id="live"></span>
  </div>
  <form id="bar" class="glass" autocomplete="off">
    <input id="ask" type="text" placeholder="Notlarınıza bir şey sorun…" maxlength="500" aria-label="Notlarınıza soru sorun">
    <button type="button" id="mic" aria-label="Mikrofon" aria-pressed="false" title="Konuşarak sor (tr-TR)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <button type="button" id="reset" title="Konuşma geçmişini unut">Yeni sohbet</button>
    <button type="submit" id="send">Sor</button>
  </form>
</div>

<!-- Pinned CDN versions. three is loaded separately only for custom node/star geometry. -->
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<script>
(() => {
  const PALETTE = ['#5ec8ff', '#ff9a5c', '#b88cff', '#5effa8', '#ffd45e', '#ff6fb1', '#5ef2ff', '#c4ff5e'];
  const nodes = GRAPH.nodes, links = GRAPH.links;
  const groups = [...new Set(nodes.map(n => n.group))].sort();       // mutated in place by syncGraph()
  const colorOf = g => PALETTE[groups.indexOf(g) % PALETTE.length];
  // Klasör adları veri; arayüzde Türkçe gösterilir (bilinmeyenler olduğu gibi kalır).
  const GROUP_TR = { customers: 'müşteriler', finance: 'finans', marketing: 'pazarlama', operations: 'operasyon',
    people: 'ekip', products: 'ürünler', notes: 'notlar', 'hafıza': 'hafıza', projects: 'projeler', ideas: 'fikirler', meetings: 'toplantılar' };
  const groupName = g => GROUP_TR[g.toLowerCase()] || g;

  // Adjacency by index (node.id === index). Computed before the graph mutates links.
  const nbrs = nodes.map(() => new Set());
  const linksOf = nodes.map(() => []);
  links.forEach(l => {
    nbrs[l.source].add(l.target); nbrs[l.target].add(l.source);
    linksOf[l.source].push(l); linksOf[l.target].push(l);
  });

  // ---------- textures ----------
  function glowTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.15, 'rgba(255,255,255,.75)');
    grd.addColorStop(0.4, 'rgba(255,255,255,.18)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const GLOW = glowTexture();

  function labelSprite(text) {
    const c = document.createElement('canvas'), g = c.getContext('2d');
    const font = '500 40px Inter, system-ui, sans-serif';
    g.font = font;
    const w = Math.ceil(g.measureText(text).width) + 24;
    c.width = w; c.height = 60;
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 8;
    g.fillStyle = '#ffffff'; g.fillText(text, w / 2, 30);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0.55 }));
    const h = 4.2; s.scale.set(h * w / 60, h, 1);
    return s;
  }

  const radius = n => 2.2 + Math.sqrt(n.degree || 1) * 0.9;

  function nodeObject(n) {
    const col = new THREE.Color(colorOf(n.group)), r = radius(n);
    const grp = new THREE.Group();
    const core = new THREE.Mesh(new THREE.SphereGeometry(r * 0.6, 24, 16),
      new THREE.MeshBasicMaterial({ color: col.clone().lerp(new THREE.Color('#ffffff'), 0.55), transparent: true }));
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: col, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 }));
    glow.scale.set(r * 8, r * 8, 1);
    const label = labelSprite(n.label);
    label.position.set(0, -(r + 4.5), 0);
    grp.add(glow); grp.add(core); grp.add(label);
    n.__core = core; n.__glow = glow; n.__label = label; n.__r = r;
    return grp;
  }

  // ---------- graph ----------
  const el = document.getElementById('graph');
  const Graph = ForceGraph3D({ controlType: 'orbit' })(el)
    .backgroundColor('#000000')
    .showNavInfo(false)
    .graphData({ nodes, links })
    .nodeId('id')
    .cooldownTime(5000)
    .nodeLabel(n => n.label)
    .nodeThreeObject(nodeObject)
    .linkOpacity(0.32)
    .linkColor(l => linkColor(l))
    .linkWidth(l => hl.links.has(l) ? 1.1 : 0)
    .linkDirectionalParticles(l => hl.links.has(l) ? 3 : 0)
    .linkDirectionalParticleWidth(1.8)
    .linkDirectionalParticleSpeed(0.006)
    .linkDirectionalParticleColor(() => hl.color || '#ffffff')
    .onNodeHover(n => { el.style.cursor = n ? 'pointer' : 'default'; })
    .onNodeClick(n => focusNode(n.id))
    .onBackgroundClick(() => clearFocus());

  Graph.d3Force('charge').strength(-140);
  Graph.d3Force('link').distance(l => l.type === 'mention' ? 55 : 90).strength(l => l.type === 'mention' ? 0.5 : 0.08);

  // ---------- starfield ----------
  const scene = Graph.scene();
  function starLayer(count, rMin, rMax, size, tint) {
    const pos = new Float32Array(count * 3), colors = new Float32Array(count * 3);
    const c = new THREE.Color();
    for (let i = 0; i < count; i++) {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      const r = rMin + Math.random() * (rMax - rMin), s = Math.sqrt(1 - u * u);
      pos.set([r * s * Math.cos(th), r * u, r * s * Math.sin(th)], i * 3);
      c.setHSL(tint + Math.random() * 0.12, 0.5, 0.75 + Math.random() * 0.25);
      colors.set([c.r, c.g, c.b], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({ size, sizeAttenuation: true, vertexColors: true, map: GLOW,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9 });
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    return pts;
  }
  const stars = [starLayer(5000, 1400, 4200, 9, 0.55), starLayer(900, 900, 2400, 16, 0.08)];
  (function drift() { stars[0].rotation.y += 0.00005; stars[1].rotation.y -= 0.00008; requestAnimationFrame(drift); })();

  // ---------- idle rotation ----------
  const controls = Graph.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableDamping = true;
  let idleTimer;
  controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); hideHint(); });
  controls.addEventListener('end', () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => controls.autoRotate = true, 5000); });
  Graph.cameraPosition({ x: 0, y: 80, z: 650 });
  let framed = false;
  const frameAll = () => { if (!framed && !hl.nodes.size) { framed = true; Graph.zoomToFit(1800, 70); } };
  Graph.onEngineStop(frameAll);
  setTimeout(frameAll, 5500);

  // ---------- highlighting ----------
  const hl = { nodes: new Set(), links: new Set(), focus: null, color: null };

  function linkColor(l) {
    if (hl.links.has(l)) return hl.color || '#ffffff';
    return l.type === 'mention' ? '#5c7cb8' : '#2b3a5c';
  }

  function applyHighlight() {
    const active = hl.nodes.size > 0;
    nodes.forEach(n => {
      if (!n.__core) return;
      const on = !active || hl.nodes.has(n.id), isFocus = hl.focus === n.id;
      n.__core.material.opacity = on ? 1 : 0.12;
      n.__glow.material.opacity = on ? (isFocus ? 1 : 0.9) : 0.08;
      const k = isFocus ? 11 : 8;
      n.__glow.scale.set(n.__r * k, n.__r * k, 1);
      n.__label.material.opacity = active ? (on ? 0.95 : 0.04) : 0.55;
    });
    Graph.linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  function flyTo(n) {
    const d = 70 + n.__r * 9;
    const len = Math.hypot(n.x, n.y, n.z) || 1;
    const k = 1 + d / len;
    Graph.cameraPosition({ x: n.x * k, y: n.y * k + 8, z: n.z * k }, { x: n.x, y: n.y, z: n.z }, 1800);
  }

  function focusNode(id, fly = true) {
    const n = nodes[id];
    if (!n) return;
    hl.nodes = new Set([id, ...nbrs[id]]);
    hl.links = new Set(linksOf[id]);
    hl.focus = id; hl.color = colorOf(n.group);
    applyHighlight();
    openPanel(n);
    controls.autoRotate = false; clearTimeout(idleTimer);
    idleTimer = setTimeout(() => controls.autoRotate = true, 9000);
    if (fly) flyTo(n);
    hideHint();
    setLegend(null);
  }

  function highlightSet(ids, color) {
    hl.nodes = new Set(ids);
    hl.links = new Set(links.filter(l => hl.nodes.has(l.source.id ?? l.source) && hl.nodes.has(l.target.id ?? l.target)));
    hl.focus = null; hl.color = color || '#ffffff';
    applyHighlight();
    if (ids.length) Graph.zoomToFit(1600, Math.min(innerWidth, innerHeight) * 0.28, n => hl.nodes.has(n.id));
  }

  function clearFocus() {
    hl.nodes.clear(); hl.links.clear(); hl.focus = null; hl.color = null;
    applyHighlight(); closePanel(); setLegend(null);
  }

  // ---------- panel ----------
  const panel = document.getElementById('panel');
  function chipButton(id, onClick) {
    const n = nodes[id], b = document.createElement('button');
    b.textContent = n.label; b.style.borderColor = colorOf(n.group) + '66';
    b.addEventListener('click', () => (onClick || focusNode)(id));
    return b;
  }
  function openPanel(n) {
    const g = document.getElementById('pGroup');
    g.textContent = groupName(n.group); g.style.color = colorOf(n.group);
    document.getElementById('pTitle').textContent = n.label;
    document.getElementById('pExcerpt').textContent = n.excerpt;
    const box = document.getElementById('pLinks'); box.replaceChildren();
    [...nbrs[n.id]].sort((a, b) => nodes[a].label.localeCompare(nodes[b].label)).forEach(id => box.appendChild(chipButton(id)));
    panel.classList.add('open'); panel.scrollTop = 0;
  }
  function closePanel() { panel.classList.remove('open'); }
  document.getElementById('closePanel').addEventListener('click', clearFocus);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });

  // ---------- legend ----------
  const legend = document.getElementById('legend');
  function renderLegend() {
  document.getElementById('stats').textContent = `${nodes.length} not · ${links.length} bağlantı`;
  legend.replaceChildren();
  groups.forEach(g => {
    const b = document.createElement('button'); b.dataset.group = g;
    const count = nodes.filter(n => n.group === g).length;
    b.innerHTML = `<span class="dot" style="background:${colorOf(g)};box-shadow:0 0 8px ${colorOf(g)}"></span><span></span><span class="n">${count}</span>`;
    b.children[1].textContent = groupName(g);
    b.addEventListener('click', () => {
      if (b.classList.contains('on')) return clearFocus();
      closePanel();
      highlightSet(nodes.filter(n => n.group === g).map(n => n.id), colorOf(g));
      setLegend(g);
    });
    legend.appendChild(b);
  });
  }
  renderLegend();
  function setLegend(g) { legend.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.group === g)); }

  const hint = document.getElementById('hint');
  function hideHint() { hint.style.opacity = 0; }

  // ---------- chat (yazılı ve sesli sorular AYNI akışı kullanır) ----------
  const session = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
  const form = document.getElementById('bar'), input = document.getElementById('ask');
  const ans = document.getElementById('answer'), aQ = document.getElementById('aQ'), aText = document.getElementById('aText'), aLinks = document.getElementById('aLinks');
  const emit = (name, detail) => document.dispatchEvent(new CustomEvent(name, { detail }));
  let askSeq = 0;

  function showAnswer(q, text, ids, isError, thinking) {
    ans.classList.add('show'); ans.classList.toggle('error', !!isError);
    aQ.textContent = q;
    aText.textContent = text; aText.classList.toggle('thinking', !!thinking);
    aLinks.replaceChildren();
    (ids || []).forEach(id => { if (nodes[id]) aLinks.appendChild(chipButton(id)); });
  }

  async function ask(q) {
    q = (q || '').trim();
    if (!q) return;
    const my = ++askSeq;                       // yalnızca en son soru ekrana yazılır ve seslendirilir
    showAnswer(q, 'Galakside aranıyor', [], false, true);
    emit('app:thinking', true);
    try {
      const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, session }) });
      let data;
      try { data = await res.json(); } catch { data = { error: `Sunucu ${res.status} döndürdü` }; }
      if (my !== askSeq) return;
      const ids = Array.isArray(data.nodes) ? data.nodes.filter(i => Number.isInteger(i) && nodes[i]) : [];
      if (data.error) showAnswer(q, data.error, ids, true);
      else showAnswer(q, data.answer || 'Yanıt gelmedi.', ids, false);
      closePanel();
      if (ids.length) highlightSet(ids, '#ffffff');
      if (!data.error && data.answer) emit('app:answer', { question: q, answer: data.answer, nodes: ids });
    } catch (err) {
      if (my === askSeq) showAnswer(q, 'Sunucuya ulaşılamadı. server.py çalışıyor mu?', [], true);
    } finally {
      emit('app:thinking', false);
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const q = input.value.trim();
    input.value = '';
    ask(q);
  });

  async function resetChat() {
    askSeq++;
    emit('app:reset');
    try { await fetch('/chat/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session }) }); } catch {}
    ans.classList.remove('show'); clearFocus();
  }
  document.getElementById('reset').addEventListener('click', () => { resetChat(); input.focus(); });

  // Sesli "… notunu aç" komutu için: söylenen ada en çok benzeyen not.
  function findNode(name) {
    const toks = s => (s || '').toLocaleLowerCase('tr-TR').split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 1);
    const want = toks(name);
    if (!want.length) return null;
    let best = null, bestScore = 0;
    nodes.forEach(n => {
      const have = toks(n.label);
      const hit = want.filter(w => have.some(h => h === w || (w.length > 3 && (h.startsWith(w) || w.startsWith(h))))).length;
      const score = hit / Math.max(want.length, have.length);
      if (score > bestScore) { bestScore = score; best = n.id; }
    });
    return bestScore >= 0.5 ? best : null;
  }

  // ---------- canlı hafıza eşitleme (memory.js) ----------
  // Silinen yıldız önce söner ve dağılır; sonra grafik sayfa yenilenmeden sunucudaki yeni graph-data.js ile
  // değiştirilir. Kimlikler (id) yeniden üretildiği için düğümler "path" ile eşleştirilir, konumlar korunur.
  function dissolve(n) {
    return new Promise(done => {
      if (!n.__core) return done();
      const t0 = performance.now(), D = 1100, r = n.__r, core0 = n.__core.scale.x;
      (function step(now) {
        const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
        n.__glow.scale.set(r * (8 + 18 * e), r * (8 + 18 * e), 1);
        n.__glow.material.opacity = 0.95 * (1 - e);
        n.__core.scale.setScalar(core0 * (1 - e) + 0.001);
        n.__core.material.opacity = 1 - e;
        n.__label.material.opacity = 0.55 * (1 - e);
        n.__label.position.y = -(r + 4.5) - 6 * e;
        if (k < 1) requestAnimationFrame(step); else done();
      })(t0);
    });
  }
  async function freshGraph() {
    const t = await (await fetch('graph-data.js', { cache: 'no-store' })).text();
    return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
  }
  let syncing = Promise.resolve();
  function syncGraph(removedPaths = []) {
    syncing = syncing.then(async () => {
      const gone = nodes.filter(n => removedPaths.includes(n.path));
      gone.forEach(n => (linksOf[n.id] || []).forEach(l => hl.links.delete(l)));
      await Promise.all(gone.map(dissolve));
      const fresh = await freshGraph();
      const old = new Map(nodes.map(n => [n.path, n]));
      fresh.nodes.forEach(n => {
        const o = old.get(n.path);
        if (o) Object.assign(n, { x: o.x, y: o.y, z: o.z, vx: 0, vy: 0, vz: 0 });
      });
      closePanel(); clearFocus();
      nodes.splice(0, nodes.length, ...fresh.nodes);
      links.splice(0, links.length, ...fresh.links);
      groups.splice(0, groups.length, ...[...new Set(nodes.map(n => n.group))].sort());
      nbrs.splice(0, nbrs.length, ...nodes.map(() => new Set()));
      linksOf.splice(0, linksOf.length, ...nodes.map(() => []));
      links.forEach(l => {
        nbrs[l.source].add(l.target); nbrs[l.target].add(l.source);
        linksOf[l.source].push(l); linksOf[l.target].push(l);
      });
      Graph.graphData({ nodes, links });
      renderLegend();
      aLinks.replaceChildren();
    }).catch(() => {});
    return syncing;
  }

  window.addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));
  window.__galaxy = window.__app = { Graph, nodes, focusNode, clearFocus, ask, resetChat, findNode, syncGraph };
})();
</script>

<script src="memory.js"></script>

  // Açılış selamı (brain.py kişilik bloğu) — yalnızca ilk tıklamadan sonra çalar.
  fetch('/boot').then(r => r.json()).then(b => { if (b.greeting) Voice.playGeminiAudio(b.greeting); }).catch(() => {});
</script>
